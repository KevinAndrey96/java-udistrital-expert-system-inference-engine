name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17', '21' ]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn clean test --batch-mode

      - name: Package Executable JAR
        run: mvn package -DskipTests --batch-mode

      - name: Verify CLI Execution (Multi-Domain Demo)
        run: |
          java -cp "target/java-udistrital-expert-system-inference-engine-1.0.0.jar:AbsoluteLayout.jar" edu.udistrital.expert.cli.ExpertSystemCli --demo

      - name: Verify KB External Loading (Animal Taxonomy)
        run: |
          java -cp "target/java-udistrital-expert-system-inference-engine-1.0.0.jar:AbsoluteLayout.jar" edu.udistrital.expert.cli.ExpertSystemCli --kb src/main/resources/kb/clasificacion-animales.kb --goal Especie

  python-verification:
    name: Architecture & Engine Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Architecture & Logic Verifier
        run: python scripts/verify_inference_engine.py

  docker-validation:
    name: Docker Containerization Build & Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t udistrital-inference-engine:latest .

      - name: Run Docker Container (CLI Demo)
        run: docker run --rm udistrital-inference-engine:latest
